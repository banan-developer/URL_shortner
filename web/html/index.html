<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISBB — Make it short by Banana</title>

    <link rel="stylesheet" type="text/css" href="../static/css/main.css">
</head>

<body>

<div id="VUE">

    <!-- =====================================================
         АВТОРИЗОВАННЫЙ ПОЛЬЗОВАТЕЛЬ
    ====================================================== -->

    <div v-if="user">

        <!-- HEADER -->
        <header id="header">

            <div class="logo">
                <h1>
                    Make it <span>short</span>
                </h1>

                <p>by Banana</p>
            </div>


            <!-- NAVIGATION -->
            <nav id="nav-main">

                <ul>
                    <li>
                        <a href="/links">
                            Управление ссылками
                        </a>

                        <a href="/profile">
                            Мой профиль
                        </a>
                    </li>
                </ul>

            </nav>

        </header>


        <!-- MAIN -->
        <main id="main">

            <div id="link-main">

                <h2>
                    Paste the URL to be shortened
                </h2>

                <input
                    placeholder="enter the link here"
                    v-model="link"
                >

                <button @click="CreateLink">
                    shorten
                </button>

                <div class="short-result">
                    {{ shortLink }}
                </div>

            </div>

        </main>


        <!-- FOOTER -->
        <footer id="footer">

            <p>
                © 2026 Make it short by Banana
            </p>

            <div>
                <a href="https://vk.ru/banana2009rusprokilleryt">
                    Контакты
                </a>
            </div>

        </footer>

    </div>


    <!-- =====================================================
         ГОСТЬ
    ====================================================== -->

    <div v-else id="guest-page">

        <!-- HEADER ГОСТЯ -->
        <header id="guest-header">

            <div class="logo">
                <h1>
                    Make it <span>short</span>
                </h1>

                <p>by Banana</p>
            </div>

        </header>


        <!-- MAIN ГОСТЯ -->
        <main id="guest-main">

            <h2>
                Paste the URL to be shortened
            </h2>

            <input
                placeholder="enter your link here"
                v-model="link"
            >

            <button @click="CreateLink">
                shorten
            </button>

            <div class="short-result">
                {{ shortLink }}
            </div>


            <p>
                Login in to manage your links
            </p>

            <button
                class="login-button"
                onclick="window.location.href='/login'"
            >
                Login in to account
            </button>

        </main>


        <!-- FOOTER ГОСТЯ -->
        <footer id="footer">

            <p>
                © 2026 Make it short by Banana
            </p>

            <div>

                <a href="https://vk.ru/banana2009rusprokilleryt">
                    Контакты
                </a>
            </div>

        </footer>

    </div>

</div>


<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
