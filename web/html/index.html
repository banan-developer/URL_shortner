<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор ссылок</title>
    <link rel="stylesheet" type="text/css" href="../static/css/main.css" />
</head>
<body>
    <div id="VUE">
        <div v-if="user">
            <div id="header">
                <h1>MISBB - Make it short by Banana</h1>
            </div>
            <div id="main">
                <div id="nav-main" >
                    <li>
                        <a style="padding: 5px;" href="/links">Управление ссылками</a>
                        <a style="padding: 5px;" href="/profile">Мой профиль</a> 
                        <a style="padding: 5px;" >Улучшить профиль</a>
                    </li>
                </div>
                <div id="link-main">
                    <h2>Past the URL to be shortened</h2>
                    <input placeholder="enter the link here" v-model="link"/>
                    <button @click="CreateLink">shorten</button>
                    {{shortLink}}
                </div>
            </div>
            <div id="footer">
                <p>© 2026 Make it short by Banana</p>
                <li>
                    <a>О нас</a> <br>
                    <a>Контакты</a>
                </li>
            </div>
        </div>
        <div v-else>
            <h1>MISBB - Make it short by Banana</h1>
            <label for="link">Past the URL to be shortened</label>
            <input placeholder="enter you link here" name="link" v-model="link">
            <button @click="CreateLink">shorten</button>
            {{shortLink}}
            <p>Login in to manage your links</p>
            <button onclick="window.location.href='/login'">Login in to account</button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
