<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" type="text/css" href="../static/css/main.css" />
</head>
<body>
    <div id="VUE">
        <div>
            <h1>Регистрация</h1>
            <form method="POST" action="/registration">
                <label for="Username">Имя</label>
                <input name="Username" placeholder="Введите Имя">

                <label for="email">Почта</label>
                <input type="email" name="email" placeholder="Введите email" autocomplete="on" required id="email">

                <label for="password">Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required id="password">

                <button type="submit">Отправить</button>
            </form>
            <p>Уже есть аккаунт?</p>
            <button onclick="window.location.href='/login'">Войти</button>
        </div>
    </div>
</body>
</html>
